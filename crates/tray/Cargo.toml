[package]
name = "quota-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows tray icon showing AI coding subscription limits"

[[bin]]
name = "quota-tray"
path = "src/main.rs"

[dependencies]
quota-core.workspace = true

# UI: Slint with the winit backend and the CPU (software) renderer only.
# No FemtoVG/OpenGL, no Slint system tray (the tray stays native Win32).
[dependencies.slint]
version = "=1.18.1"
default-features = false
features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-software",
    # Path elements (the rings) in the software renderer.
    "software-renderer-path",
    # System fonts for the off-screen preview renderer.
    "software-renderer-systemfonts",
    "accessibility",
    # The popup's HWND, for Windows 11 corners and tool-window style.
    "raw-window-handle-06",
    # Window focus events (close on click-away).
    "unstable-winit-030",
]

[build-dependencies]
slint-build = "=1.18.1"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
