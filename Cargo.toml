[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/tray"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
quota-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
basic-toml = "0.1"
# Blocking HTTP, TLS through Windows SChannel (no rustls/ring).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Cursor keeps state in SQLite; bundled = no system sqlite needed.
rusqlite = { version = "0.42", features = ["bundled"] }
windows-sys = "0.61"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
